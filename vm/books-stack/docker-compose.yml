services:
  komga:
    image: gotson/komga:1.29.2@sha256:1d89b79f6cee732438c0c51f876373ad1c6a0d6cdae47c008bfa24e1d1bed748
    container_name: komga
    user: "1000:1000"             # runs as your media user
    environment:
      - TZ=Asia/Dhaka
      # Optional: tune Java heap if you have a big library
      # - JAVA_OPTS=-Xmx2g
    volumes:
      # Komga app data (keystore, DB, thumbnails, etc.)
      - ./komga/config:/config

      # Your libraries on the HDD (map each to a subpath under /data)
      - /data/books/comic:/data/comics
      - /data/books/manga:/data/manga
      - /data/books/novels:/data/novels


    ports:
      - "25600:25600"
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest@sha256:98a20064168ab284bbb8e048af48c89a5e25650f35a4b217705241af94c1debe
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - ./calibre-web/config:/config
      - /data/books/calibre-library:/books
    ports:
      - "8083:8083"
    restart: unless-stopped
