services:
  syncthing:
    image: ghcr.io/linuxserver/syncthing:latest@sha256:9e9b931bf48a8a08bffaaa7e2fc2b7d0126b02def2bf1d3395d9b531817f9af3
    container_name: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ../toolkit/syncthing/config:/config
      - /data:/data                     # full data tree, or swap for a sub‑path
    ports:
      - 8384:8384                       # Web UI
      - 22000:22000/tcp                 # Sync protocol
      - 22000:22000/udp
      - 21027:21027/udp                 # LAN discovery
    restart: unless-stopped

  metube:
    image: ghcr.io/alexta69/metube@sha256:df4b25db48351e58fe732b26a92e5d5b06734e1470894707c659fb1bafd3688e
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /data:/data

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest@sha256:7d58149aa544037d173a48f41fbde86706068d2b8933a33a911dce26457ecf16
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
    ports:
      - '7575:7575'


  beets:
    image: lscr.io/linuxserver/beets:latest@sha256:f4deaf89c7087cb935b5be66b50a1bf2a8450be1ac27e2c6e847228a8eb64913
    container_name: beets
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ./beets/config:/config
      - /data/media/music:/downloads
      - /data/media/music-sorted:/music
    ports:
      - 8337:8337
    restart: unless-stopped

