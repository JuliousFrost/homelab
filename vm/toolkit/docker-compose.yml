services:
  syncthing:
    image: ghcr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ../toolkit/syncthing/config:/config
      - /data:/data                     # full data tree, or swap for a sub‑path
    ports:
      - 8384:8384                       # Web UI
      - 22000:22000/tcp                 # Sync protocol
      - 22000:22000/udp
      - 21027:21027/udp                 # LAN discovery
    restart: unless-stopped

  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /data:/data

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
    ports:
      - '7575:7575'


  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Dhaka
    volumes:
      - ./beets/config:/config
      - /data/media/music:/downloads
      - /data/media/music-sorted:/music
    ports:
      - 8337:8337
    restart: unless-stopped

